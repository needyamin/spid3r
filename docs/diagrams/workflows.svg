<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img">
<title>Spid3r GitHub Actions workflows: CI, release, fuzz</title>
<desc>Three automation lanes. ci.yml runs a 6-job matrix (core differential, GUI, WASM, native AOT, Phase 0 measurement gates, self-host parity gate). release.yml builds four Linux/macOS tarballs, a Windows NSIS installer, then verifies and publishes the GitHub release. fuzz.yml runs six cargo-fuzz targets (lexer, parser, bytecode, ini_parser, serialize, http_ws) on a weekly schedule with crash artifacts and a 2 GB memory bound.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
