<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img">
<title>Spid3r GitHub Actions Workflows: CI, Self-Hosted Release, and Fuzz automation</title>
<desc>Detailed architecture and execution graph of Spid3r GitHub Actions workflows: 6-job CI matrix covering Core, GUI, WASM, LLVM 23 Native AOT with Linux self-host bootstrap, Phase 0 measurement gates, and Self-host Parity Gate over the 134-program frozen corpus; Self-hosted Release pipeline building 4 Linux and macOS tarballs plus Windows NSIS installer packaging spid3r-self, spid3r, and SHA-256-pinned runtime staticlib artifacts; and scheduled/PR cargo-fuzz regression suite.</desc>
