<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img">
<title>Generics, monomorphization, and unboxed containers in Spid3r</title>
<desc>Generic functions with constraint bounds and typed containers flow through the parser and semantic checker into polymorphic VM/Tree execution and unboxed AOT LLVM IR specialization.</desc>
<defs>
<marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="880" height="320" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<text x="440" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">R10 · Generics, Constraints, Monomorphization &amp; Unboxed Containers</text>

<!-- Source -->
<rect x="28" y="64" width="186" height="96" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="121" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Source (.matrix)</text>
<text x="121" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">fn add&lt;T: Numeric&gt;(a: T, b: T)</text>
<text x="121" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">add&lt;int&gt;(10, 32)</text>
<text x="121" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">let xs: list&lt;int&gt; = [1, 2]</text>

<path d="M214 112 L248 112" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr-g)"/>

<!-- Parser + Checker -->
<rect x="254" y="56" width="218" height="112" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1"/>
<text x="363" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#312E81">Parser + Semantic Checker</text>
<text x="363" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4338CA">Multi-arg TypeExpr.args (&lt;K, V&gt;)</text>
<text x="363" y="116" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4338CA">Bounds: Numeric · Comparable · Iface</text>
<text x="363" y="134" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4338CA">Call/New type-arg substitution</text>
<text x="363" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4338CA">Erased &lt;T&gt; back-compat preserved</text>

<!-- Branching -->
<path d="M472 90 L516 90" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr-g)"/>
<path d="M472 140 L494 140 L494 226 L516 226" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr-g)"/>

<!-- Tree / VM / WASM -->
<rect x="522" y="56" width="330" height="72" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1"/>
<text x="687" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Tree · Bytecode VM · WASM</text>
<text x="687" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">Polymorphic Value execution</text>
<text x="687" y="116" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">Exact semantic parity (tree == vm == native)</text>

<!-- AOT Native Monomorphizer + Unboxed Lists -->
<rect x="522" y="148" width="330" height="148" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2"/>
<text x="687" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#134E4A">LLVM 23 AOT Native Specialization</text>
<text x="687" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0F766E">spid3r_mono_add__int(i64, i64) -&gt; i64</text>
<text x="687" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#115E59">Unboxed i64 / f64 / i1 scalar params &amp; returns</text>
<line x1="540" y1="224" x2="834" y2="224" stroke="#99F6E4" stroke-width="1"/>
<text x="687" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0F766E">spid3r_ulist_i64_* · spid3r_ulist_f64_*</text>
<text x="687" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#115E59">Non-escaping list&lt;int&gt; / list&lt;float&gt; -&gt; Vec&lt;i64/f64&gt;</text>
<text x="687" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#115E59">Zero per-element Value boxing or Mutex lock</text>

<!-- Bottom note -->
<rect x="28" y="194" width="444" height="102" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
<text x="250" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#92400E">Safety &amp; Fallback Guarantees (DP-1)</text>
<text x="250" y="238" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B45309">• Escaping containers or &gt;64 specializations fall back to boxed Value</text>
<text x="250" y="256" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B45309">• Bounds checks &amp; checked overflow match Tree/VM semantics</text>
<text x="250" y="274" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B45309">• Selfhost sources (selfhost/*.matrix) remain 100% generic-free</text>
</svg>
