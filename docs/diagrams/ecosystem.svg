<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img">
<title>Four routes by which third-party code reaches a Spid3r program</title>
<desc>A program on the left receives code through four supported core routes, each labelled with its trust tier: the embedded standard library (T0: 26 embedded modules and 254 built-in natives), project source files (T1), vendored packages checked against spider.lock (T2), and native FFI extern fn in AOT builds (T5). Rust hosts embed via spid3r_lang::embed::Engine, and external CLI tools dispatch via spidr-name executables on PATH.</desc>
<defs>
<marker id="ec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="880" height="300" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<rect x="32" y="100" width="120" height="64" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="92" y="122" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#0F172A">your program</text>
<text x="92" y="144" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748B">.matrix / .mt entry</text>

<path d="M152 132 L186 132" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
<path d="M186 44 L186 212" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
<path d="M186 44 L218 44" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ec)"/>
<path d="M186 100 L218 100" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ec)"/>
<path d="M186 156 L218 156" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ec)"/>
<path d="M186 212 L218 212" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ec)"/>

<rect x="222" y="24" width="618" height="40" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="238" y="44" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0F766E">T0</text>
<text x="272" y="44" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#0F172A">Built-in standard library (26 embedded modules · 254 natives)</text>
<text x="824" y="44" text-anchor="end" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">compiled in, immutable</text>

<rect x="222" y="80" width="618" height="40" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="238" y="100" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0F766E">T1</text>
<text x="272" y="100" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#0F172A">Project .matrix / .mt files</text>
<text x="824" y="100" text-anchor="end" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">same trust as your own source</text>

<rect x="222" y="136" width="618" height="40" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="238" y="156" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0F766E">T2</text>
<text x="272" y="156" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#0F172A">Vendored packages (spider.toml + vendor/)</text>
<text x="824" y="156" text-anchor="end" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">checksummed · spid3r verify re-checks</text>

<rect x="222" y="192" width="618" height="40" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="238" y="212" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0F766E">T5</text>
<text x="272" y="212" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#0F172A">FFI (extern fn)</text>
<text x="824" y="212" text-anchor="end" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">trusted code, AOT only</text>

<rect x="32" y="256" width="14" height="10" rx="2" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="54" y="261" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748B">Host apps embed via spid3r_lang::embed::Engine · External CLI tools use spidr-&lt;name&gt; on PATH</text>
</svg>
