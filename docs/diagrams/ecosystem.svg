<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img">
<title>Seven routes by which third-party code reaches a Spid3r program</title>
<desc>A program on the left receives code through seven routes, each labelled with its trust tier: the embedded standard library, project source files, Spid3r plugins written in the language, vendored packages, WASM plugins host plugins and native FFI — every route ships. Only the WASM plugin route is sandboxed; the Spid3r, host and FFI routes are trusted code.</desc>
<defs>
<marker id="ec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="880" height="420" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<rect x="32" y="158" width="120" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="92" y="180" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#0F172A">your program</text>
<text x="92" y="200" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748B">one .matrix entry</text>

<path d="M152 188 L186 188" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
<path d="M186 44 L186 332" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
<path d="M186 44 L218 44" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ec)"/>
<path d="M186 92 L218 92" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ec)"/>
<path d="M186 140 L218 140" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ec)"/>
<path d="M186 188 L218 188" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ec)"/>
<path d="M186 236 L218 236" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ec)"/>
<path d="M186 284 L218 284" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ec)"/>
<path d="M186 332 L218 332" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ec)"/>

<rect x="222" y="24" width="618" height="40" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="238" y="44" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0F766E">T0</text>
<text x="272" y="44" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#0F172A">Built-in standard library</text>
<text x="824" y="44" text-anchor="end" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">compiled in, immutable</text>

<rect x="222" y="72" width="618" height="40" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="238" y="92" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0F766E">T1</text>
<text x="272" y="92" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#0F172A">Project .matrix files</text>
<text x="824" y="92" text-anchor="end" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">same trust as your own source</text>

<rect x="222" y="120" width="618" height="40" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="238" y="140" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0F766E">T1</text>
<text x="272" y="140" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#0F172A">Spid3r plugins (kind = "matrix")</text>
<text x="824" y="140" text-anchor="end" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">written in the language, script trust</text>

<rect x="222" y="168" width="618" height="40" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="238" y="188" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0F766E">T2</text>
<text x="272" y="188" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#0F172A">Vendored packages</text>
<text x="824" y="188" text-anchor="end" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">checksummed · spid3r verify re-checks</text>

<rect x="222" y="216" width="618" height="40" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="238" y="236" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0F766E">T3</text>
<text x="272" y="236" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#0F172A">WASM plugins</text>
<text x="824" y="236" text-anchor="end" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">sandboxed, no ambient authority</text>

<rect x="222" y="264" width="618" height="40" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="238" y="284" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0F766E">T4</text>
<text x="272" y="284" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#0F172A">Host plugins</text>
<text x="824" y="284" text-anchor="end" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">trusted code, cannot be sandboxed</text>

<rect x="222" y="312" width="618" height="40" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="238" y="332" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0F766E">T5</text>
<text x="272" y="332" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#0F172A">FFI (extern fn)</text>
<text x="824" y="332" text-anchor="end" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">trusted code, AOT only</text>

<rect x="32" y="376" width="14" height="10" rx="2" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="54" y="381" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748B">shipped today</text>
<text x="150" y="381" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748B">Capability filtering is a policy filter over known builtin names — not a sandbox.</text>
</svg>
