<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" width="880" height="384" role="img">
<title>Spid3r compilation pipeline: one front end, four backends</title>
<desc>Source code passes through lexer, parser, semantic checker and lower into a checked AST. Four backends consume that AST: the tree walker as reference oracle, the bytecode VM, the LLVM native compiler, and the WebAssembly build. All four must produce identical stdout, stderr phase and exit code.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="880" height="384" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<rect x="380" y="34" width="120" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="440" y="56" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#0F172A">app.matrix</text>

<path d="M440 78 L440 94" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="100" y="96" width="150" height="46" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="175" y="112" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#0F172A">lexer</text>
<text x="175" y="129" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">tokens</text>

<path d="M250 119 L273 119" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="275" y="96" width="150" height="46" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="350" y="112" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#0F172A">parser</text>
<text x="350" y="129" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">syntax tree</text>

<path d="M425 119 L448 119" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="450" y="96" width="150" height="46" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="525" y="112" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#0F172A">semantic</text>
<text x="525" y="129" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">types · scopes · lints</text>

<path d="M600 119 L623 119" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="625" y="96" width="150" height="46" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="700" y="112" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#0F172A">lower</text>
<text x="700" y="129" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">desugar</text>

<path d="M700 142 L700 180 L556 180" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="330" y="158" width="220" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
<text x="440" y="180" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#075985">checked AST</text>

<path d="M440 202 L440 218" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
<path d="M140 218 L740 218" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
<path d="M140 218 L140 236" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M340 218 L340 236" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M540 218 L540 236" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M740 218 L740 236" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="50" y="238" width="180" height="76" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="140" y="260" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#78350F">tree</text>
<text x="140" y="280" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#92400E">walks the AST</text>
<text x="140" y="297" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B45309">reference oracle</text>

<rect x="250" y="238" width="180" height="76" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="340" y="260" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#134E4A">vm</text>
<text x="340" y="280" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">AST → bytecode</text>
<text x="340" y="297" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">59 opcodes · optimizer</text>

<rect x="450" y="238" width="180" height="76" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="540" y="260" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#134E4A">native</text>
<text x="540" y="280" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">LLVM ahead-of-time</text>
<text x="540" y="297" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">real machine code</text>

<rect x="650" y="238" width="180" height="76" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="740" y="260" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#134E4A">wasm</text>
<text x="740" y="280" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">the same VM, wasm32</text>
<text x="740" y="297" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">browser · playground</text>

<path d="M50 330 L830 330" fill="none" stroke="#E2E8F0" stroke-width="1"/>
<text x="440" y="352" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#475569">One contract, four backends: identical stdout, identical error phase, identical exit code.</text>
</svg>
