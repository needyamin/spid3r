<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img">
<title>Spid3r OCI container engine architecture</title>
<desc>The spid3r container CLI drives two subsystems: src/oci/ (Registry v2 pull with Bearer auth, SHA-256 verification of manifest and every layer before caching, optional Ed25519 signature enforcement, hardened tar extraction with whiteouts) and src/container/ (overlayfs snapshotter with GC, OCI bundle config, IPAM pool, cgroups v2, daemon recovery). Linux syscall shims live in src/native/sys.rs — the sanctioned unsafe home, gated to Linux + the container feature, zero external crates.</desc>
<defs>
<marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="880" height="300" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<text x="440" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">OCI Container Engine (DP-7)</text>

<!-- CLI -->
<rect x="28" y="58" width="180" height="110" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="118" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">spid3r container</text>
<text x="118" y="110" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">pull · create · run</text>
<text x="118" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">stop · ps · inspect</text>
<text x="118" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">rm · gc</text>

<path d="M208 113 L240 113" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr-c)"/>

<!-- src/oci/ -->
<rect x="246" y="58" width="290" height="110" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="391" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#134E4A">src/oci/ — image &amp; layers</text>
<text x="391" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#0F766E">Registry v2 pull · Bearer auth</text>
<text x="391" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#0F766E">SHA-256 verify every blob (exit 4)</text>
<text x="391" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#0F766E">optional Ed25519 · hardened tar + whiteouts</text>

<path d="M536 113 L568 113" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr-c)"/>

<!-- src/container/ -->
<rect x="574" y="58" width="278" height="110" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1"/>
<text x="713" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#312E81">src/container/ — runtime &amp; store</text>
<text x="713" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4338CA">overlayfs snapshotter + GC</text>
<text x="713" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4338CA">OCI bundle · IPAM · cgroups v2</text>
<text x="713" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4338CA">daemon state recovery</text>

<!-- src/native/sys.rs -->
<rect x="28" y="204" width="824" height="70" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
<text x="440" y="228" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#991B1B">src/native/sys.rs (DP-7) — sanctioned unsafe home</text>
<text x="440" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#7F1D1D">Linux syscall shims (unshare, setns, mount, pivot_root, …) · gated to Linux + container feature · zero external crates</text>
</svg>
