<rect x="28" y="204" width="824" height="92" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
<text x="440" y="226" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#991B1B">src/native/sys.rs (DP-7) — #[cfg(all(target_os = "linux", feature = "container"))]</text>
<text x="440" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#B91C1C">unshare · setns · mount / umount2 · pivot_root · chroot · sethostname · PR_SET_NO_NEW_PRIVS · setuid/setgid · fork/waitpid/kill</text>
<text x="440" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#7F1D1D">Zero external crates · Written SAFETY comments &amp; errno-mapped errors · Gated out of core (--no-default-features) &amp; wasm32 builds</text>
</svg>
