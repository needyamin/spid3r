<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img">
<title>Spid3r enterprise spkg architecture: wheels, atomic vendoring, signed registries, audit, SBOM, auto-FFI, and global tools</title>
<desc>A Spid3r package combines a spider.toml manifest (dependencies, dev-dependencies, optional-dependencies, [ffi], and [bin]) with src/ and optional prebuilt native/&lt;target&gt;/ binaries. spkg install resolves local paths, Git, directory registries, and HTTPS registries (supporting per-target wheels, SPID3R_REGISTRY_TOKEN Bearer auth, --frozen, --offline, --dev, and --extra), staging files atomically into vendor/&lt;pkg&gt;/ and locking source plus native SHA-256 digests in spider.lock. spkg verify, spkg audit, and spkg freeze --sbom check vendor hashes, signed registry metadata (registry.toml.sig, index.txt.sig, yanked.txt.sig, advisories.txt.sig), and export CycloneDX 1.5 SBOMs. yamc / spid3r build re-verifies vendor hashes against spider.lock before auto-linking [ffi] libraries, and spkg tool compiles [bin] entrypoints into isolated .matrixc shims. Zero install-time build scripts run.</desc>
