<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 248" width="880" height="248" role="img">
<title>Spid3r packages: declare, vendor, verify, publish, install — checksummed end to end</title>
<desc>A package is a spider.toml manifest plus a src tree. spid3r add vendors it into the project and pins it in spider.lock. spid3r verify re-hashes every vendored file against the lock, so a hand-edited dependency fails instead of compiling. spid3r publish --to-dir writes a static registry entry with a checksum, and spid3r install requires that checksum — an entry without one is refused rather than vendored unverified. No network build scripts: installing a package never executes its code.</desc>
<defs>
<marker id="pa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="880" height="248" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<rect x="28" y="88" width="150" height="80" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
<text x="103" y="110" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0F172A">spider.toml</text>
<text x="103" y="130" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">manifest + src/ tree</text>
<text x="103" y="148" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">a package is just files</text>

<path d="M178 128 L216 128" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#pa)"/>
<text x="197" y="114" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#0F766E">spid3r add</text>

<rect x="220" y="88" width="150" height="80" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="295" y="110" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#134E4A">vendored</text>
<text x="295" y="130" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">copied into your project,</text>
<text x="295" y="148" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">pinned in spider.lock</text>

<path d="M370 128 L408 128" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#pa)"/>
<text x="389" y="114" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#0F766E">spid3r verify</text>

<rect x="412" y="88" width="150" height="80" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="487" y="110" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#134E4A">re-hashed</text>
<text x="487" y="130" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">every file re-checked</text>
<text x="487" y="148" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">vs the lock — edits fail</text>

<path d="M562 128 L600 128" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#pa)"/>
<text x="581" y="114" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#0F766E">publish --to-dir</text>

<rect x="604" y="88" width="120" height="80" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="664" y="110" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#78350F">registry</text>
<text x="664" y="130" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#92400E">static entry +</text>
<text x="664" y="148" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#92400E">checksum</text>

<path d="M724 128 L762 128" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#pa)"/>
<text x="743" y="114" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#0F766E">spid3r install</text>

<rect x="766" y="88" width="86" height="80" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="809" y="110" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#134E4A">usable</text>
<text x="809" y="130" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">no checksum,</text>
<text x="809" y="148" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">no install</text>

<text x="440" y="214" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">No network build scripts — installing a package never executes its code.</text>
</svg>
