<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img">
<title>Spid3r runtime configuration and remote management (SPID3R_INI, 28 schema-frozen keys)</title>
<desc>Top band: remote management flows from the operator's machine through the spid3r-agent/1 protocol (TCP, ChaCha20 + HMAC-SHA256, one-time 48-hex pairing) to a role gate (viewer, operator, admin; no unrestricted shell) and predefined operations, each call audited and saved atomically. Bottom band: spid3r.ini precedence — env SPID3R_* over the authoritative SPID3R_INI pin over compiled defaults, with no fallback; 28 schema-frozen keys cannot be changed via remote config.set; a broken pin fails closed with exit 1 while diagnostics still work.</desc>
<defs>
<marker id="ra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="880" height="420" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<!-- ============ BAND 1: REMOTE MANAGEMENT ============ -->
<text x="40" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#64748B">REMOTE MANAGEMENT</text>

<rect x="40" y="50" width="180" height="96" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="130" y="74" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Operator's machine</text>
<text x="130" y="96" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">spid3r admin pair</text>
<text x="130" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">admin --host web-1 status</text>

<rect x="247" y="50" width="180" height="96" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="337" y="74" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#0F172A">spid3r-agent/1</text>
<text x="337" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">TCP · ChaCha20 + HMAC</text>
<text x="337" y="116" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">pair once · 48-hex code</text>

<rect x="454" y="50" width="180" height="96" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="544" y="74" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#78350F">Role gate</text>
<text x="544" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#92400E">viewer · operator · admin</text>
<text x="544" y="116" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#92400E">no unrestricted shell</text>

<rect x="661" y="50" width="180" height="96" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="751" y="74" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#134E4A">Ops → audit + save</text>
<text x="751" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">predefined ops only</text>
<text x="751" y="116" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">every call → audit log</text>

<path d="M220 98 L243 98" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ra)"/>
<path d="M427 98 L450 98" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ra)"/>
<path d="M634 98 L657 98" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ra)"/>

<!-- ============ BAND 2: RUNTIME CONFIGURATION ============ -->
<text x="40" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#64748B">RUNTIME CONFIGURATION</text>

<rect x="40" y="192" width="250" height="170" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="165" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">spid3r.ini precedence</text>
<rect x="60" y="232" width="210" height="26" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="165" y="245" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F172A">process env  SPID3R_*</text>
<path d="M165 259 L165 264" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ra)"/>
<rect x="60" y="266" width="210" height="26" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="165" y="279" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#134E4A">spid3r.ini  (SPID3R_INI)</text>
<path d="M165 293 L165 298" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ra)"/>
<rect x="60" y="300" width="210" height="26" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="165" y="313" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">compiled defaults</text>
<text x="165" y="348" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B45309">SPID3R_INI authoritative — no fallback</text>

<rect x="315" y="192" width="250" height="170" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="440" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#78350F">28 schema-frozen keys</text>
<text x="440" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#92400E">not settable via remote config.set</text>
<text x="440" y="276" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#78350F">security.*   logging.*   agent.*</text>
<text x="440" y="296" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#78350F">paths.*   cache.*   packages.*</text>
<text x="440" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#92400E">edit the ini file instead</text>

<rect x="590" y="192" width="250" height="170" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="715" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Fails closed + atomic</text>
<text x="715" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#475569">broken pin → refuse run (exit 1)</text>
<text x="715" y="266" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#475569">version / help / info still work</text>
<text x="715" y="296" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#475569">atomic save: temp file + rename</text>
<text x="715" y="314" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#475569">remote info redacts paths</text>

<text x="440" y="394" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#475569">One installed binary can be inspected, reconfigured and operated from another machine — without a shell.</text>
</svg>
