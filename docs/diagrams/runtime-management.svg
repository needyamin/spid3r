<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img">
<title>Spid3r runtime configuration and remote management</title>
<desc>The spid3r.ini configuration file and the encrypted management agent. An admin client pairs once with a one-time 48-hex code, then speaks the spid3r-agent/1 protocol over TCP with ChaCha20 plus HMAC-SHA256 encryption. Every request is checked against the caller's role — viewer, operator or admin — and dispatched to a predefined operation; there is no unrestricted shell. Every call is written to the audit log and configuration is saved atomically.</desc>
<defs>
<marker id="ra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="rr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="880" height="470" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<!-- host: agent listener -->
<rect x="60" y="46" width="240" height="96" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="180" y="68" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#134E4A">spid3r agent start</text>
<text x="180" y="90" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">listens on [agent] bind:port (9527)</text>
<text x="180" y="106" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">off until [agent] enabled = true</text>
<rect x="96" y="114" width="168" height="20" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="180" y="124" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#92400E">no unrestricted shell</text>

<!-- wire pill -->
<rect x="352" y="56" width="176" height="76" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="440" y="72" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#0F172A">spid3r-agent/1 · TCP</text>
<text x="440" y="88" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748B">ChaCha20 + HMAC-SHA256</text>
<text x="440" y="103" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748B">encrypt-then-MAC · header is AAD</text>
<text x="440" y="119" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B45309">pair once: one-time 48-hex code</text>

<!-- admin client -->
<rect x="580" y="46" width="260" height="96" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="710" y="66" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#0F172A">operator's machine</text>
<text x="710" y="88" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#0F172A">spid3r admin pair 10.0.0.5:9527 …</text>
<text x="710" y="104" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#0F172A">spid3r admin --host web-1 status</text>
<text x="710" y="120" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#0F172A">… config.set --key agent.name …</text>

<path d="M300 94 L348 94" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ra)"/>
<path d="M532 94 L576 94" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ra)"/>

<!-- role gate -->
<path d="M180 142 L180 176" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ra)"/>
<rect x="60" y="180" width="240" height="104" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="180" y="200" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#78350F">every request is role-checked</text>
<text x="180" y="222" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#92400E">viewer · operator · admin</text>
<text x="180" y="240" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#92400E">ops allow-list from [agent] role_*</text>
<text x="180" y="257" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#B45309">an unknown operation is refused —</text>
<text x="180" y="272" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#B45309">no path from the wire to a shell</text>

<!-- predefined ops -->
<path d="M300 232 L346 232" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ra)"/>
<rect x="350" y="180" width="240" height="104" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="470" y="198" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#134E4A">predefined operations only</text>
<text x="470" y="216" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#0F766E">ping · reload_config · gc_collect</text>
<text x="470" y="231" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#0F766E">self_test · dump_diagnostics</text>
<text x="470" y="246" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#0F766E">restart_runtime · logs.tail</text>
<text x="470" y="261" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#0F766E">config.get/set · ops.run</text>
<text x="470" y="274" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#0F766E">devices.list · modules.list</text>

<!-- audit + atomic writes -->
<path d="M590 232 L636 232" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ra)"/>
<rect x="640" y="180" width="200" height="104" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="740" y="200" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#0F172A">every call is audited</text>
<text x="740" y="222" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748B">audit.log — JSON lines</text>
<text x="740" y="238" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748B">device · role · op · ok · peer</text>
<text x="740" y="257" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748B">config + state files are written</text>
<text x="740" y="272" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748B">atomically (temp file + rename)</text>

<!-- config precedence strip -->
<rect x="60" y="316" width="780" height="94" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="80" y="334" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#0F172A">spid3r.ini — precedence, highest wins</text>
<text x="80" y="355" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">process env SPID3R_* → [env.&lt;name&gt;] (SPID3R_ENV) → spid3r.ini → compiled defaults · an invalid value is ignored, the default stays</text>
<text x="80" y="374" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">live reload: SIGHUP · spid3r config reload · agent reload_config · restart_runtime: ack → exit → child retries the bind</text>
<text x="80" y="393" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B45309">config.set can never touch security.*, logging.*, agent.role_* or agent.enabled/bind/port — edit spid3r.ini on the host</text>

<!-- config feeds the role gate -->
<path d="M250 314 L250 288" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#rr)"/>

<text x="440" y="436" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">One installed binary can be inspected, reconfigured and operated from another machine — without a shell.</text>
</svg>
