<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img">
<title>Spid3r runtime configuration and remote management (authoritative SPID3R_INI, 27 schema-frozen keys)</title>
<desc>The spid3r.ini configuration file and the encrypted management agent. SPID3R_INI is authoritative: when set and non-empty it is the only ini candidate, with no fallback to the machine or working-directory file; a broken pin fails closed, refusing program execution with exit 1 while --version, help, info, config path and config validate still work. Configuration validation reports a broken pin with exit 1; unknown config flags are usage errors (exit 2). Local spid3rinfo() includes configuration notes and pin-failure details; remote info and dump_diagnostics omit the configuration-notes row and redact Installation paths. Local validation keeps policy paths visible so operators can diagnose misconfiguration. An admin client pairs once with a one-time 48-hex code, then speaks the spid3r-agent/1 protocol over TCP with ChaCha20 plus HMAC-SHA256 encryption. Every request is checked against the caller's role — viewer, operator or admin — and dispatched to a predefined operation; there is no unrestricted shell. Remote config.set is refused for the 27 schema-frozen keys derived from KeySpec.frozen: all seven security.* keys, all four logging.* keys, agent.role_viewer/role_operator/role_admin, the six agent listener switches (enabled, bind, port, max_connections, request_timeout_ms, max_body), modules.disable, packages.allow_insecure_git, packages.allow_local_git, paths.cache_dir, paths.state_dir, paths.sqlite_path and cache.bytecode_dir. Every call is written to the audit log and configuration is saved atomically.</desc>
<defs>
<marker id="ra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="880" height="470" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<!-- ============ BAND 1: REMOTE MANAGEMENT ============ -->
<text x="40" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#64748B">REMOTE MANAGEMENT</text>

<!-- 1. operator -->
<rect x="40" y="48" width="180" height="128" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="130" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#0F172A">Operator's machine</text>
<text x="130" y="92" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#0F172A">spid3r admin pair</text>
<text x="130" y="110" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#475569">10.0.0.5:9527 …</text>
<text x="130" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#475569">admin --host web-1 status</text>
<text x="130" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B45309">one-time 48-hex code</text>

<!-- 2. wire -->
<rect x="247" y="48" width="180" height="128" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="337" y="70" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#0F172A">spid3r-agent/1</text>
<text x="337" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748B">TCP transport</text>
<text x="337" y="106" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#475569">ChaCha20 + HMAC-SHA256</text>
<text x="337" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748B">encrypt-then-MAC · AAD</text>
<text x="337" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B45309">pair once · 48-hex code</text>

<!-- 3. role gate -->
<rect x="454" y="48" width="180" height="128" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="544" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#78350F">Role gate</text>
<text x="544" y="90" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#92400E">viewer · operator · admin</text>
<text x="544" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#92400E">allow-list: [agent] role_*</text>
<text x="544" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#92400E">no unrestricted shell</text>
<text x="544" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B45309">unknown op → refused</text>

<!-- 4. ops + audit -->
<rect x="661" y="48" width="180" height="128" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="751" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#134E4A">Ops → audit + save</text>
<text x="751" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#0F766E">predefined only:</text>
<text x="751" y="106" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#0F172A">ping·reload_config·gc</text>
<text x="751" y="122" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#0F172A">config·self_test·…</text>
<text x="751" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#0F766E">each call → audit.log</text>
<text x="751" y="156" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#0F766E">atomic save (tmp+rename)</text>

<path d="M220 112 L243 112" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ra)"/>
<path d="M427 112 L450 112" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ra)"/>
<path d="M634 112 L657 112" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ra)"/>

<!-- ============ BAND 2: RUNTIME CONFIGURATION ============ -->
<text x="40" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#64748B">RUNTIME CONFIGURATION</text>

<!-- card 1: precedence ladder -->
<rect x="40" y="218" width="250" height="196" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="165" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#0F172A">spid3r.ini precedence</text>
<rect x="60" y="256" width="210" height="26" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="165" y="269" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#0F172A">process env  SPID3R_*</text>
<path d="M165 283 L165 288" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ra)"/>
<rect x="60" y="290" width="210" height="26" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="165" y="303" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#134E4A">spid3r.ini  (SPID3R_INI)</text>
<path d="M165 317 L165 322" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ra)"/>
<rect x="60" y="324" width="210" height="26" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="165" y="337" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#475569">compiled defaults</text>
<text x="165" y="366" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B45309">SPID3R_INI authoritative — no fallback</text>
<text x="165" y="384" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#475569">higher rung wins · invalid ignored</text>
<text x="165" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748B">live reload: SIGHUP · reload</text>

<!-- card 2: frozen keys -->
<rect x="315" y="218" width="250" height="196" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="440" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#78350F">27 schema-frozen keys</text>
<text x="440" y="264" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#92400E">Not settable via remote</text>
<text x="440" y="280" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#92400E">config.set — edit the ini</text>
<text x="440" y="304" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#78350F">security.*   logging.*</text>
<text x="440" y="320" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#78350F">agent.role_*   paths.*</text>
<text x="440" y="336" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#78350F">cache.*   modules.*</text>
<text x="440" y="352" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#78350F">packages.*   + more</text>
<text x="440" y="376" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#92400E">7 security · 4 logging · 6 agent</text>
<text x="440" y="392" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#92400E">switches · paths/cache/…</text>

<!-- card 3: fails closed + atomic -->
<rect x="590" y="218" width="250" height="196" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="715" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#0F172A">Fails closed + atomic</text>
<text x="715" y="266" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">broken pin → refuse run (exit 1)</text>
<text x="715" y="284" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">version / help / info / config</text>
<text x="715" y="302" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">still work (diagnostics open)</text>
<text x="715" y="324" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">atomic save: temp file + rename</text>
<text x="715" y="344" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">local policy paths stay visible;</text>
<text x="715" y="362" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">remote info omits config row</text>
<text x="715" y="380" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">and redacts Installation paths</text>
<text x="715" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748B">no partial / in-place writes</text>

<text x="440" y="446" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">One installed binary can be inspected, reconfigured and operated from another machine — without a shell.</text>
</svg>
