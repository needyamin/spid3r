<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 248" width="880" height="248" role="img">
<title>Spid3r host plugins: declare, implement, register — merged into the native table</title>
<desc>A host plugin declares itself in a plugin.toml with an exact-match ABI string and one block per function giving its arity and permission, implements one Rust trait, and is registered by its host at startup via spid3r_lang::plugin::register. Registration merges its functions into the native table all three engines already read, so a plugin function needs no per-engine code. There is no dynamic loading: the plugin is compiled into its host, and it is trusted code — same address space, same authority, not sandboxable.</desc>
<defs>
<marker id="ha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="880" height="248" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<rect x="28" y="80" width="180" height="88" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
<text x="118" y="102" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0F172A">plugin.toml</text>
<text x="118" y="122" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">exact-match ABI string ·</text>
<text x="118" y="140" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">one block per function:</text>
<text x="118" y="158" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">arity + permission</text>

<path d="M208 124 L246 124" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ha)"/>

<rect x="250" y="80" width="180" height="88" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
<text x="340" y="102" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0F172A">impl Plugin</text>
<text x="340" y="122" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">one Rust trait —</text>
<text x="340" y="140" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">each function is a native</text>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">over Value</text>

<path d="M430 124 L468 124" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ha)"/>

<rect x="472" y="80" width="196" height="88" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
<text x="570" y="102" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#0F172A">plugin::register(...)</text>
<text x="570" y="122" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">host registers the plugin</text>
<text x="570" y="140" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">at startup — before any</text>
<text x="570" y="158" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">engine installs its globals</text>

<path d="M668 124 L706 124" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ha)"/>

<rect x="710" y="80" width="142" height="88" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="781" y="102" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#134E4A">native table</text>
<text x="781" y="122" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">all three engines read</text>
<text x="781" y="140" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">the same table —</text>
<text x="781" y="158" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">no per-engine code</text>

<rect x="28" y="196" width="824" height="30" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="440" y="211" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#92400E">Trusted code: same address space, same authority — no dynamic loading; compiled into its host. Its declared permission gates script calls.</text>
</svg>
