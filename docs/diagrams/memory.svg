<text x="156" y="334" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#312E81">16-byte ValueV2 ABI</text>
<text x="156" y="354" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4338CA">inline int · float · bool · null · SSO str</text>
