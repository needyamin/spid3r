<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 412" width="880" height="412" role="img">
<title>Spid3r memory model: reference counting, cycle collector, and bounded AOT reclamation</title>
<desc>Compact 16-byte Values (ThinArcStr and lock-free FastMutex prior to first spawn) are reference counted, freeing acyclic garbage immediately. Reference cycles are reclaimed by a mark-sweep cycle collector with 30 GcTrace implementations and non-blocking REGISTRY dead-entry pruning. On the Native AOT backend, 16-byte ValueV2 keeps scalars and SSO strings inline, while heap boxes live in thread-local AOT_HEAP tracked by precise frame roots (spid3r_frame_enter/exit), loop safepoint polls (spid3r_cancel_check invoking spid3r_gc_safepoint every 64 alloc or 2048 compute iterations), bounded multithreaded container pools (64/32 caps), and worker-exit sweeps.</desc>
<defs>
<marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="880" height="412" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
