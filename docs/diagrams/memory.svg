<text x="440" y="354" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#0F766E">spid3r_frame_enter / exit</text>
<text x="440" y="372" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">safepoints: 64 alloc · 2048 compute</text>

<path d="M564 353 L596 353" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#b)"/>

<rect x="600" y="314" width="248" height="78" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="724" y="334" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#134E4A">Bounded Pools &amp; Worker Trim</text>
<text x="724" y="354" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">64 / 32 MT container pool caps</text>
<text x="724" y="372" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">task-exit sweep → flat HTTP RSS</text>

