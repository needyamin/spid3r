<path d="M280 353 L312 353" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#b)"/>

<rect x="316" y="314" width="248" height="78" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
