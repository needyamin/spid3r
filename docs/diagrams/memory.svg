<text x="40" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Reference counted (16-byte Value)</text>
<text x="470" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Cyclic (Mark-Sweep Collector)</text>

