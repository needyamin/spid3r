<text x="78" y="69" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0F172A">a</text>
<rect x="50" y="104" width="56" height="30" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="78" y="119" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0F172A">b</text>

<rect x="170" y="64" width="130" height="60" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
<text x="235" y="84" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#075985">list [1, 2]</text>
<text x="235" y="104" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0369A1">rc = 2</text>

