<path d="M106 119 L166 106" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#b)"/>

<text x="50" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">count reaches 0 → freed immediately</text>
<rect x="44" y="178" width="364" height="76" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="60" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Compact layout &amp; lock-free fast path</text>
<text x="60" y="220" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">• 8-byte ThinArcStr + boxed Result → 16-byte Value</text>
<text x="60" y="238" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">• FastMutex skips atomics until first spawn</text>

