<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img">
<title>Spid3r memory model: reference counting plus a cycle collector</title>
<desc>Values are reference counted, so acyclic garbage is freed the moment its count reaches zero. A cycle keeps both counts at one and never frees, so a tracing mark-and-sweep collector reclaims it.</desc>
<defs>
<marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="880" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<path d="M440 56 L440 250" fill="none" stroke="#E2E8F0" stroke-width="1"/>

<text x="40" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#0F172A">Reference counted</text>
<text x="470" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#0F172A">Cyclic</text>

<rect x="50" y="60" width="56" height="30" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="78" y="75" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0F172A">a</text>
<rect x="50" y="110" width="56" height="30" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="78" y="125" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0F172A">b</text>

<rect x="170" y="70" width="130" height="60" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
<text x="235" y="90" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#075985">list [1, 2]</text>
<text x="235" y="110" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0369A1">rc = 2</text>

<path d="M106 75 L166 88" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#b)"/>
<path d="M106 125 L166 112" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#b)"/>

<text x="50" y="168" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">count reaches 0 → freed immediately</text>

<rect x="500" y="60" width="120" height="50" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="560" y="78" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#78350F">node A</text>
<text x="560" y="95" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#92400E">rc = 1</text>

<rect x="500" y="130" width="120" height="50" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="560" y="148" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#78350F">node B</text>
<text x="560" y="165" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#92400E">rc = 1</text>

<path d="M620 74 C 686 74 686 166 624 166" fill="none" stroke="#B45309" stroke-width="1.5" marker-end="url(#b)"/>
<path d="M500 166 C 434 166 434 74 496 74" fill="none" stroke="#B45309" stroke-width="1.5" marker-end="url(#b)"/>

<text x="700" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B45309">never reaches 0</text>

<rect x="400" y="212" width="320" height="46" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="560" y="228" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#134E4A">cycle collector</text>
<text x="560" y="244" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">trace from roots · free the unreachable ring</text>
<path d="M560 182 L560 208" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#b)"/>

</svg>
