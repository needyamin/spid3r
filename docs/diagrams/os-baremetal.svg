<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img">
<title>Spid3rOS bare-metal x86-64 kernel architecture</title>
<desc>Zero-dependency no_std kernel workspace member: Multiboot2 boot with COM1 serial and VGA console, GDT/IDT with a 4K bitmap frame allocator and bump heap, ELF64 userland with freestanding Spid3r init and virtio device support. Built and tested via cargo test and spid3r kernel build; QEMU CI boots the image.</desc>
<defs>
<marker id="arr-os" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="880" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<text x="440" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Spid3rOS Bare-Metal Kernel (x86_64-unknown-none · DP-8)</text>

<rect x="28" y="58" width="260" height="96" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="158" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Boot &amp; console</text>
<text x="158" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#334155">Multiboot2 header at 1 MiB</text>
<text x="158" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#334155">COM1 serial · VGA · PS/2 shell</text>

<path d="M288 106 L320 106" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr-os)"/>

<rect x="326" y="58" width="260" height="96" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="456" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#134E4A">CPU · memory · scheduler</text>
<text x="456" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#0F766E">64-bit GDT/IDT + exception handlers</text>
<text x="456" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#0F766E">4K frame allocator · bump heap · run-queue</text>

<path d="M586 106 L618 106" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr-os)"/>

<rect x="624" y="58" width="228" height="96" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1"/>
<text x="738" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#312E81">Userland &amp; virtio</text>
<text x="738" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4338CA">ELF64 validator + syscalls</text>
<text x="738" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4338CA">freestanding init · virtio-net/blk</text>

<rect x="28" y="182" width="824" height="70" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
<text x="440" y="208" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#92400E">Toolchain — spid3r kernel build</text>
<text x="440" y="232" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#B45309">cargo test · kernel.bin + SHA-256 sidecar · zero external crates · QEMU CI boot check</text>
</svg>
