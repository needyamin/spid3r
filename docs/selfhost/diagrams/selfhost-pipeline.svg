<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img">
<title>Self-hosted 17-module compiler architecture inside selfhost/</title>
<desc>selfhost/main.matrix dispatches front-end, bytecode, LLVM-C AOT, and developer tool commands across 17 flat-namespace Spid3r modules under selfhost/: token, lexer, lexer_json, ast, parser, semantic, lower, vmc, bytecode_matrix, flatten, codegen, llvm, link, test_runner, fmt, and pkg.</desc>
<defs>
<marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="880" height="440" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<text x="32" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Self-Hosted Compiler Pipeline &amp; 17-Module Layout (selfhost/ · SH-3 · SH-7)</text>
<text x="32" y="54" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748B">One flat module root (no ../ escapes); top-level helpers prefixed per module (lex_, chk_, cg_, fl_, link_, fmt_, pkg_)</text>

<!-- CLI Router -->
<rect x="32" y="72" width="816" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
<text x="48" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#0C4A6E">main.matrix</text>
<text x="155" y="92" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#075985">CLI driver &amp; mode dispatch: tokens · parse · check · compile · build / native · test · fmt · pack/unpack/verify/dist · verify-runtime</text>
<text x="48" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0369A1">Strict exit code contract: 0 ok · 1 compile/test failure · 2 usage / linker failure · 4 tampered artifact / runtime pin error (SEC-B)</text>

<!-- Front-end chain -->
<text x="32" y="138" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">FRONT END (1:1 ORACLE PARITY WITH src/lexer, src/parser, src/semantic, src/lower)</text>

<rect x="32" y="148" width="150" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="107" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0F172A">token + lexer</text>
<text x="107" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Byte-slice fast scan</text>
<text x="107" y="200" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748B">+ lexer_json.matrix</text>

<path d="M182 179 L198 179" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-p)"/>

<rect x="202" y="148" width="150" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="277" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0F172A">ast + parser</text>
<text x="277" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Recursive descent AST</text>
<text x="277" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748B">Byte-identical AST JSON</text>

<path d="M352 179 L368 179" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-p)"/>

<rect x="372" y="148" width="150" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="447" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0F172A">semantic.matrix</text>
<text x="447" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Types, scopes &amp; lints</text>
<text x="447" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748B">Registry dump parity</text>

<path d="M522 179 L538 179" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-p)"/>

<rect x="542" y="148" width="144" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="614" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0F172A">lower.matrix</text>
<text x="614" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#475569">Desugar &amp; lower AST</text>
<text x="614" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748B">Shared by VM + AOT</text>

<path d="M686 179 L702 179" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-p)"/>

<rect x="706" y="148" width="142" height="62" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="777" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#134E4A">flatten.matrix</text>
<text x="777" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#0F766E">Import DAG merger</text>
<text x="777" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#0F766E">No .. escapes allowed</text>

<!-- Branch arrows down to Bytecode vs AOT -->
<path d="M614 210 L614 236 L220 236 L220 250" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr-p)"/>
<path d="M777 210 L777 236 L630 236 L630 250" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr-p)"/>

<!-- Left branch: Bytecode Path -->
<rect x="32" y="254" width="380" height="84" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="48" y="275" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">BYTECODE TARGET (spid3r-self compile)</text>
<text x="48" y="295" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0F172A">vmc.matrix → bytecode_matrix.matrix → .matrixc</text>
<text x="48" y="313" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">• 60 opcodes + constant folding / peephole optimizer</text>
<text x="48" y="328" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">• Writes SHA-256-checksummed bytecode container</text>

<!-- Right branch: Native AOT Path -->
<rect x="436" y="254" width="412" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
<text x="452" y="275" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">NATIVE AOT TARGET (spid3r-self native / build)</text>
<text x="452" y="295" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#064E3B">codegen.matrix → llvm.matrix → link.matrix → .exe</text>
<text x="452" y="313" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#065F46">• LLVM-C via T5 ptr/usize FFI + default&lt;O3&gt; PassBuilder</text>
<text x="452" y="328" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#065F46">• Unboxed top-int locals + SHA-256 staticlib pin check</text>

<!-- Bottom Dev Tools Row -->
<rect x="32" y="354" width="816" height="64" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="48" y="375" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">SELF-HOSTED DEVELOPER CLI MODULES (PORTED IN PHASE 8 · ZERO RUST REQUIRED)</text>
<text x="48" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0F172A">test_runner.matrix</text>
<text x="180" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">spid3r test   ·</text>
<text x="275" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0F172A">fmt.matrix</text>
<text x="352" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">fmt / --check   ·</text>
<text x="458" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0F172A">pkg.matrix</text>
<text x="536" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">pack · unpack · verify · dist</text>
<text x="48" y="409" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748B">(Plus 4 roundtrip/smoke helpers in selfhost/: roundtrip_tokens.matrix, roundtrip_ast.matrix, link_test.matrix, llvm_min.matrix)</text>
</svg>
