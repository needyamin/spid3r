<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img">
<title>Self-hosted compiler architecture inside selfhost/</title>
<desc>selfhost/main.matrix dispatches front-end, bytecode, LLVM-C AOT and developer-tool commands across flat-namespace Spid3r modules: token+lexer, ast+parser, semantic, lower and flatten form the front end; vmc and bytecode_matrix emit checksummed .matrixc; codegen, llvm and link produce native executables; test_runner, fmt and pkg round out the dev CLI. Strict exit-code contract: 0 ok, 1 failure, 2 usage/linker, 4 tampered artifact.</desc>
<defs>
<marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="880" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<text x="32" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Self-Hosted Compiler Pipeline (selfhost/)</text>
<text x="32" y="54" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748B">one flat module root — 1:1 parity with the Rust front end</text>

<!-- CLI Router -->
<rect x="32" y="72" width="816" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
<text x="48" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#0C4A6E">main.matrix</text>
<text x="155" y="94" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#075985">CLI dispatch: parse · check · compile · native · test · fmt · pkg · verify-runtime</text>
<text x="740" y="94" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0369A1">exit 0/1/2/4</text>

<!-- Front-end chain -->
<text x="32" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">FRONT END</text>

<rect x="32" y="152" width="146" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="105" y="180" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0F172A">token · lexer</text>
<path d="M178 179 L194 179" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-p)"/>
<rect x="198" y="152" width="146" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="271" y="180" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0F172A">ast · parser</text>
<path d="M344 179 L360 179" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-p)"/>
<rect x="364" y="152" width="146" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="437" y="180" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0F172A">semantic</text>
<path d="M510 179 L526 179" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-p)"/>
<rect x="530" y="152" width="146" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="603" y="180" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0F172A">lower</text>
<path d="M676 179 L692 179" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-p)"/>
<rect x="696" y="152" width="152" height="54" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<text x="772" y="180" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#134E4A">flatten</text>

<path d="M603 206 L603 232 L220 232 L220 252" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr-p)"/>
<path d="M772 206 L772 232 L630 232 L630 252" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr-p)"/>

<!-- Two targets -->
<rect x="32" y="256" width="380" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="48" y="280" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#475569">BYTECODE</text>
<text x="48" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#0F172A">vmc → bytecode_matrix → .matrixc</text>

<rect x="436" y="256" width="412" height="72" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
<text x="452" y="280" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#047857">NATIVE AOT</text>
<text x="452" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#064E3B">codegen → llvm → link → executable</text>

<!-- Dev tools -->
<rect x="32" y="348" width="816" height="24" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="48" y="360" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#334155">Dev CLI (self-hosted, zero Rust):</text>
<text x="260" y="360" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0F172A">test_runner · fmt · pkg</text>
</svg>
