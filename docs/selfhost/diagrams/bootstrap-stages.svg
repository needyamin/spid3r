<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img">
<title>Spid3r self-hosting bootstrap stages and fixed-point verification</title>
<desc>Stage 0 (the Rust spid3r binary) compiles selfhost/main.matrix to produce Stage 1 (spid3r-self). From Stage 1 onward there are zero cargo/rustc calls: Stage 1 compiles Stage 2, Stage 2 compiles Stage 3, and the Stage 3 object is bit-identical (SHA-256) to Stage 2's. A frozen corpus of 136 programs verifies three-way parity across stages.</desc>
<defs>
<marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0D9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="880" height="360" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<text x="32" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Bootstrap Chain: Stage 0 → Stage 1 → Stage 2 → Stage 3</text>
<text x="32" y="54" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748B">Rust Stage 0 seeds Stage 1 via YamLLVM (LLVM 23); zero cargo/rustc from there on</text>

<!-- Shared inputs -->
<rect x="32" y="72" width="400" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="48" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#0F172A">selfhost/main.matrix</text>
<text x="48" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">the compiler, written in Spid3r</text>

<rect x="448" y="72" width="400" height="42" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="464" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#78350F">spid3r_lang (.lib / .a)</text>
<text x="464" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#92400E">SHA-256-pinned runtime staticlib</text>

<!-- Stages -->
<rect x="32" y="142" width="182" height="110" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
<text x="46" y="164" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#B45309">STAGE 0 · SEED</text>
<text x="46" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#78350F">spid3r (Rust)</text>
<text x="46" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#92400E">cold bootstrap seed</text>
<text x="46" y="234" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#92400E">parity oracle · rollback v1.1.1</text>

<path d="M214 197 L248 197" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-slate)"/>
<text x="231" y="186" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#475569">AOT</text>

<rect x="252" y="142" width="182" height="110" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
<text x="266" y="164" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369A1">STAGE 1</text>
<text x="266" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#0C4A6E">spid3r-self</text>
<text x="266" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#075985">built by Stage 0</text>
<text x="266" y="234" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#075985">zero cargo from here on</text>

<path d="M434 197 L468 197" fill="none" stroke="#0D9488" stroke-width="1.5" marker-end="url(#arr-teal)"/>
<text x="451" y="186" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#0F766E">no Rust</text>

<rect x="472" y="142" width="182" height="110" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2"/>
<text x="486" y="164" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F766E">STAGE 2</text>
<text x="486" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#134E4A">spid3r-self-2</text>
<text x="486" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">built by Stage 1</text>
<text x="486" y="234" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0F766E">ships in release tarballs</text>

<path d="M654 197 L688 197" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="671" y="186" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#047857">verify</text>

<rect x="692" y="142" width="156" height="110" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="706" y="164" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">STAGE 3 · FIXED POINT</text>
<text x="706" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#064E3B">spid3r_main.o</text>
<text x="706" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#065F46">bit-identical to Stage 2</text>
<text x="706" y="234" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#065F46">determinism proved</text>

<rect x="596" y="272" width="248" height="24" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
<text x="720" y="284" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#047857">SHA-256(S2.o) == SHA-256(S3.o)</text>

<!-- Parity bar -->
<rect x="32" y="312" width="816" height="32" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="440" y="328" text-anchor="middle" dominant-baseline="central" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#0F172A">Three-way parity gate: Stage 0 == Stage 1 == Stage 2 over the frozen 136-program corpus (SH-4 · SH-5)</text>
</svg>
