<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img">
<title>Ownership boundary: pure self-hosted Spid3r vs retained Rust Stage 0</title>
<desc>Compiler development, builds, dev tools and compiler releases run purely in selfhost/ via spid3r-self with zero cargo or rustc calls. They link across a SHA-256-pinned runtime ABI (spid3r_lang staticlib; 87 trampolines and 254 stdlib natives; tampering fails with exit 4) to the Rust components that stay permanently: the Stage 0 seed and parity oracle, runtime internals, and non-compiler engines and tools.</desc>

<rect x="0" y="0" width="880" height="360" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<text x="32" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Pure Self-Hosted vs Permanently Rust</text>
<text x="32" y="54" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748B">compiler work needs zero cargo/rustc; Rust remains seed, oracle, pinned runtime, non-compiler tooling</text>

<!-- Left: pure selfhost -->
<rect x="32" y="74" width="320" height="260" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
<text x="48" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857">PURE SELF-HOSTED (ZERO RUST)</text>
<text x="48" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#065F46">selfhost/*.matrix + spid3r-self</text>

<rect x="48" y="132" width="288" height="56" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
<text x="60" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#064E3B">Compiler &amp; AOT native builds</text>
<text x="60" y="174" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">Stage 1 → 2 → 3 · LLVM O3</text>

<rect x="48" y="196" width="288" height="56" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
<text x="60" y="220" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#064E3B">Dev CLI tools</text>
<text x="60" y="238" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">parse · check · compile · test · fmt · pkg</text>

<rect x="48" y="260" width="288" height="56" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
<text x="60" y="284" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#064E3B">Release compiler artifacts</text>
<text x="60" y="302" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">tarballs · NSIS installer · sha256sums</text>

<!-- Center: pinned ABI -->
<rect x="368" y="74" width="144" height="260" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.3"/>
<text x="440" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0369A1">PINNED ABI</text>
<rect x="380" y="114" width="120" height="56" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1"/>
<text x="440" y="138" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0C4A6E">spid3r_lang</text>
<text x="440" y="156" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748B">staticlib .lib / .a</text>
<rect x="380" y="180" width="120" height="56" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1"/>
<text x="440" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0C4A6E">C ABI surface</text>
<text x="440" y="218" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748B">87 tramp · 254 natives</text>
<rect x="380" y="246" width="120" height="70" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1"/>
<text x="440" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0C4A6E">SHA-256 pin</text>
<text x="440" y="286" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">manifest + sidecar</text>
<text x="440" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#B91C1C">tamper → exit 4</text>

<!-- Right: permanent Rust -->
<rect x="528" y="74" width="320" height="260" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
<text x="544" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#B45309">PERMANENT RUST STAGE 0 &amp; TOOLS</text>
<text x="544" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#92400E">src/ + spid3r + tools/</text>

<rect x="544" y="132" width="288" height="56" rx="6" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1"/>
<text x="556" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#78350F">Cold seed &amp; parity oracle</text>
<text x="556" y="174" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">bootstraps Stage 1 · rollback binary</text>

<rect x="544" y="196" width="288" height="56" rx="6" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1"/>
<text x="556" y="220" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#78350F">Runtime internals</text>
<text x="556" y="238" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">value · gc · scheduler · stdlib</text>

<rect x="544" y="260" width="288" height="56" rx="6" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1"/>
<text x="556" y="284" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#78350F">Non-compiler engines &amp; harnesses</text>
<text x="556" y="302" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#334155">tree · vm · repl · gui · wasm · tools/</text>
</svg>
