<text x="440" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0369A1">PINNED ABI</text>
<text x="440" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#075985">RUNTIME_ABI.md</text>

