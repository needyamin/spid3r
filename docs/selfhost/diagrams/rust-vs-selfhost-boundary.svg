<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img">
<title>Permanent ownership boundary between pure self-hosted Spid3r and retained Rust Stage 0</title>
<desc>Compiler development, builds, formatting, packaging, and compiler releases run purely in selfhost/ via spid3r-self with zero cargo or rustc calls, linked across a SHA-256-pinned 70-trampoline and 257-native runtime ABI to retained Rust components: the cold bootstrap seed and parity oracle, the pinned spid3r_lang staticlib, non-compiler runtimes (VM, tree, REPL, debug, LSP, agent, GUI, wasm), and tools/ harnesses.</desc>

<rect x="0" y="0" width="880" height="420" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<text x="32" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A">What Runs Purely Self-Hosted vs What Stays Rust Permanently (SH-2 · SH-6 · SH-8)</text>
<text x="32" y="54" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748B">Compiler builds need zero cargo/rustc; Rust Stage 0 remains as seed, oracle, pinned runtime staticlib, and non-AOT tooling</text>

<!-- Left Column: Pure Selfhost -->
<rect x="32" y="74" width="320" height="320" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
<text x="48" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857">PURE SELF-HOSTED (ZERO RUST)</text>
<text x="48" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#065F46">selfhost/*.matrix + spid3r-self</text>

<rect x="48" y="130" width="288" height="72" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
<text x="60" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#064E3B">Compiler &amp; AOT Native Builds</text>
<text x="60" y="168" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">• Stage 1 → Stage 2 → Stage 3 compiler edits</text>
<text x="60" y="184" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">• LLVM 23 IR + default&lt;O3&gt; + system link</text>

<rect x="48" y="212" width="288" height="72" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
<text x="60" y="232" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#064E3B">Core Dev CLI Tools</text>
<text x="60" y="250" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">• tokens, parse, check, compile (.matrixc)</text>
<text x="60" y="266" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">• test, fmt / --check, pack/unpack/verify/dist</text>

<rect x="48" y="294" width="288" height="82" rx="6" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
<text x="60" y="314" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#064E3B">Release Compiler Artifacts</text>
<text x="60" y="332" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">• release_selfhost.sh builds spid3r-self</text>
<text x="60" y="348" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">• 4 Linux/macOS tarballs + Windows NSIS</text>
<text x="60" y="364" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">• Spid3r-Setup-&lt;ver&gt;.exe + sha256sums.txt</text>

