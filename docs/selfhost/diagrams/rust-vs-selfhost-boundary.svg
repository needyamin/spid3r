<text x="440" y="219" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0C4A6E">C ABI Surface</text>
<text x="440" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#075985">70 spid3r_* tramp.</text>
<text x="440" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#075985">257 stdlib natives</text>

<rect x="380" y="274" width="120" height="102" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1"/>
<text x="440" y="294" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0C4A6E">SHA-256 Pin</text>
<text x="440" y="311" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">runtime-manifest</text>
<text x="440" y="325" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#334155">+ .sha256 sidecar</text>
<text x="440" y="344" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#B91C1C">Tamper → Exit 4</text>
<text x="440" y="359" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#64748B">(never links!)</text>

