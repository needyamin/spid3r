<text x="556" y="250" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">• src/native/rt.rs, value.rs, gc/, scheduler.rs</text>
<text x="556" y="266" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#334155">• src/stdlib/ (one source across tree/VM/AOT)</text>

<rect x="544" y="294" width="288" height="82" rx="6" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1"/>
<text x="556" y="314" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#78350F">Excluded Engines, Host &amp; Harnesses</text>
