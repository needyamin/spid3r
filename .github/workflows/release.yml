name: Release

# Builds the prebuilt Linux/macOS tarballs, the Windows NSIS installer, and
# the versioned SHA-256-pinned runtime staticlib artifacts.
#
# Phase 10.1 (SH-2, docs/selfhost/SELFHOST.md): all release compiler binaries
# (`spid3r-self`) are compiled by `spid3r-self` itself (Stage 1 -> Stage 2 with
# Stage-3 fixed-point proof) against the SHA-256-pinned runtime staticlib,
# via `tools/release_selfhost.sh`. Stage 0 (`spid3r`) remains as the bootstrap
# reference and runtime host for VM/interpreter/REPL/debugger/GUI tools.
#
# Asset protection: the publish job uses `clobber: false`, so re-running the
# workflow against an existing release FAILS instead of silently replacing a
# published tarball that users may already have verified by checksum.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # build.rs no longer drives release packaging; tools/release_selfhost.sh does.
  SPID3R_NO_INSTALLER: "1"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
            extra_env: "CARGO_PROFILE_RELEASE_LTO=false CFLAGS=-arch\\ x86_64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install LLVM 23 (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo apt-get install -y llvm-23-dev libllvm23
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          echo "SPID3R_LLVM_LIB_DIR=/usr/lib/llvm-23/lib" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 25
        run: |
          brew install llvm || brew upgrade llvm
          PREFIX="$(brew --prefix llvm)"
          "$PREFIX/bin/llvm-config" --version
          echo "LLVM_SYS_231_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "SPID3R_LLVM_LIB_DIR=$PREFIX/lib" >> "$GITHUB_ENV"
          # Append (do not prepend via GITHUB_PATH) so Apple's /usr/bin/clang
          # and /usr/bin/ar are never shadowed by Homebrew's LLVM binaries.
          echo "PATH=$PATH:$PREFIX/bin" >> "$GITHUB_ENV"

      # Pinned to the same toolchain as rust-toolchain.toml and ci.yml (1.99.1).
      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}

      - name: Build Stage-0 bootstrap & pinned runtime staticlib
        timeout-minutes: 45
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            export CARGO_PROFILE_RELEASE_LTO=false
            export CFLAGS="-arch x86_64"
          fi
          if ! cargo build --release --locked --target ${{ matrix.target }} --no-default-features --features native 2>&1 | tee cargo_build.log; then
            (grep -E 'warning: ignoring file|ld: |error(\[|:)' cargo_build.log | head -n 8; tail -n 6 cargo_build.log) | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 101
          fi

      - name: Build & verify self-hosted release tarball (Stage 1 -> Stage 2 -> Stage 3)
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          if ! bash tools/release_selfhost.sh build \
            --target "${{ matrix.target }}" \
            --stage0 "target/${{ matrix.target }}/release/spid3r" \
            --staticlib "target/${{ matrix.target }}/release/libspid3r_lang.a" \
            --out-dir release-out \
            --skip-installer 2>&1 | tee release_selfhost.log; then
            tail -n 8 release_selfhost.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 2
          fi
          cp release-out/spid3r-*.tar.gz release-out/spid3r-*.tar.gz.sha256 .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            spid3r-${{ matrix.target }}.tar.gz
            spid3r-${{ matrix.target }}.tar.gz.sha256
            spid3r-runtime-*.tar.gz
            spid3r-runtime-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # Windows NSIS installer: tools/release_selfhost.sh compiles Stage-2
  # `spid3r-self.exe` using `spid3r-self`, verifies Stage-3 fixed point,
  # pins `spid3r_lang.lib` via runtime-manifest.json + .sha256, and invokes
  # makensis on packaging/nsis/spid3r.nsi (bundling LLVM-C + spid3r-self.exe +
  # retained VM/GUI tools), followed by a silent install smoke test.
  windows-installer:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-installer

      - name: Install NSIS and LLVM 23.1.0
        timeout-minutes: 20
        run: |
          choco install nsis -y --no-progress
          curl -L -o LLVM-23.1.0-win64.msi https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0/LLVM-23.1.0-win64.msi
          Start-Process msiexec -ArgumentList '/i', 'LLVM-23.1.0-win64.msi', '/qn', '/norestart' -Wait
          Test-Path "C:\Program Files\LLVM\bin\LLVM-C.dll"
          Test-Path "C:\Program Files\LLVM\lib\LLVM-C.lib"
          "LLVM_SYS_231_PREFIX=C:\Program Files\LLVM" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SPID3R_LLVM_LIB_DIR=C:\Program Files\LLVM\lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build Stage-0 runtime & GUI control host
        timeout-minutes: 55
        run: cargo build --release --locked --no-default-features --features gui,native,plugins-wasm,tls

      - name: Build self-hosted release compiler & NSIS installer (spid3r-self)
        shell: bash
        timeout-minutes: 25
        run: |
          set -o pipefail
          LIB="target/release/spid3r_lang.lib"
          [ -f "$LIB" ] || LIB="$(find target -name spid3r_lang.lib | head -n 1)"
          test -s "$LIB"
          if ! bash tools/release_selfhost.sh build \
            --target x86_64-pc-windows-msvc \
            --stage0 target/release/spid3r.exe \
            --control target/release/spid3r-control.exe \
            --staticlib "$LIB" \
            --llvm-version 23.1.0 \
            --smoke-install \
            --out-dir release-out 2>&1 | tee release_selfhost_win.log; then
            tail -n 20 release_selfhost_win.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 2
          fi
          cp release-out/Spid3r-Setup-*.exe release-out/Spid3r-Setup-*.exe.sha256 .
          cp release-out/spid3r-runtime-*.tar.gz release-out/spid3r-runtime-*.tar.gz.sha256 .

      - name: Verify the installer and its native payload
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Filter "Spid3r-Setup-*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "::error::no Spid3r-Setup-*.exe was produced"; exit 1 }
          if ($exe.Length -lt 15MB) { Write-Error "::error::installer is $($exe.Length) bytes — the native/LLVM payload is missing"; exit 1 }
          Write-Host "Installer: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-installer
          path: |
            Spid3r-Setup-*.exe
            Spid3r-Setup-*.exe.sha256
            spid3r-runtime-*.tar.gz
            spid3r-runtime-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release assets
    needs: [build, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Verify all four tarballs and the Windows installer are present
        run: |
          cd dist
          for t in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin; do
            test -s "spid3r-${t}.tar.gz" || { echo "MISSING: spid3r-${t}.tar.gz"; exit 1; }
            tar tzf "spid3r-${t}.tar.gz" | grep -q '^spid3r-self$' || { echo "MISSING spid3r-self in spid3r-${t}.tar.gz"; exit 1; }
          done
          ls Spid3r-Setup-*.exe || { echo "MISSING: Spid3r-Setup-*.exe"; exit 1; }
          ls -l

      - name: Generate combined checksum file
        run: |
          cd dist
          cat *.sha256 > sha256sums.txt
          sha256sum -c sha256sums.txt

      - name: Upload verified release bundle (dry-run or tag)
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle-verified
          path: |
            dist/*.tar.gz
            dist/Spid3r-Setup-*.exe
            dist/sha256sums.txt
          retention-days: 7

      # Attaches the release assets only on a pushed `v*` tag (`workflow_dispatch`
      # exercises the full build, fixed point, checksums, and smoke tests as a dry run).
      - name: Attach assets to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/spid3r-*.tar.gz
            dist/spid3r-runtime-*.tar.gz
            dist/Spid3r-Setup-*.exe
            dist/sha256sums.txt
          clobber: false
          fail_on_unmatched_files: true
          body: |
            Prebuilt spid3r binaries (`spid3r-self` compiled by the self-hosted toolchain + `spid3r` VM/interpreter tools) and the Windows NSIS installer (with bundled LLVM + SHA-256-pinned runtime staticlib).

            Install on Linux/macOS:
            ```
            curl -fsSL https://raw.githubusercontent.com/needyamin/spid3r/main/install.sh | sh
            ```

            Windows: run `Spid3r-Setup-<version>.exe`. SHA-256 sums: `sha256sums.txt`.
