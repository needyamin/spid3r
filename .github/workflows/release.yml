name: Release

# Builds the prebuilt Linux/macOS tarballs that install.sh downloads.
#
# Why this workflow exists: install.sh fetches
#   https://github.com/needyamin/spid3r/releases/download/v<VERSION>/spid3r-<TARGET>.tar.gz
# for exactly these four targets:
#   x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu,
#   x86_64-apple-darwin,      aarch64-apple-darwin
# The v1.0.0 release shipped only the Windows NSIS installer, so every
# Linux/macOS install (and CI runner using install.sh) 404'd. Tagging a
# release with this workflow attached fixes that: it builds all four
# tarballs and attaches them as release assets named exactly
# `spid3r-<target>.tar.gz`.
#
# Build configuration: `--no-default-features` (core-only). The default
# features need LLVM 18 (`native`) and WebKit2GTK (`gui`), which are heavy
# system dependencies no release tarball should carry; core-only is what
# `install.sh --source --core` produces, so tarballs and source builds match.
#
# The `tls` feature is deliberately NOT enabled: native-tls on Linux resolves
# to openssl-sys, which needs libssl-dev headers at build time AND links
# libssl.so.3 dynamically — that would turn a zero-dependency binary into one
# that fails on machines without OpenSSL 3 runtime. macOS (Security.framework)
# would be safe, but all four tarballs are kept uniform. Users who need
# https in `http_fetch` can build from source with --features tls.
#
# Asset protection: the publish job uses `clobber: false`, so re-running the
# workflow against an existing release FAILS instead of silently replacing a
# published tarball that users may already have verified by checksum. To
# replace assets, delete them (or the release) first, deliberately.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # install.sh warns on musl (Alpine); these are glibc builds, as it documents.
  SPID3R_NO_INSTALLER: "1"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 Linux: stock runner, plain cargo, no cross tooling.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          # aarch64 Linux: free arm64 runner for public repos; the binary is
          # built AND executed natively (a real smoke test, not emulation).
          # If this runner label is ever retired, switch to cross-rs:
          #   os: ubuntu-24.04 + `cargo install cross` + `cross build ...`
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # Both macOS targets build on one arm64 runner: aarch64 natively,
          # x86_64 via `rustup target add` + `cargo --target` (Xcode's
          # toolchain cross-links x86_64 out of the box). The x86_64 binary
          # is not executed here (see the smoke-test step's `if:`).
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned to the same toolchain as rust-toolchain.toml and ci.yml
      # (1.99.1). Bump all three together — see the comment in ci.yml.
      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}

      - name: Build (core-only, zero system dependencies)
        timeout-minutes: 45
        run: cargo build --release --locked --target ${{ matrix.target }} --no-default-features

      # Run the binary where we can. The one exception is the x86_64 macOS
      # binary built on an arm64 host — it is inspected with `file` instead
      # so packaging never depends on Rosetta being present.
      - name: Smoke test the built binary
        if: matrix.cross != true
        run: ./target/${{ matrix.target }}/release/spid3r --version

      - name: Inspect the cross-compiled binary
        if: matrix.cross == true
        run: |
          file target/${{ matrix.target }}/release/spid3r
          file target/${{ matrix.target }}/release/spid3r | grep -q "x86_64"

      # Binary at the tarball ROOT (no wrapping directory) — the cleanest
      # layout for install.sh, which `find`s the binary either way.
      - name: Package tarball
        run: |
          tar czf "spid3r-${{ matrix.target }}.tar.gz" \
              -C "target/${{ matrix.target }}/release" spid3r
          # `sha256sum` on Linux, `shasum -a 256` on macOS (BSD shasum ships
          # with the OS; GNU coreutils is not guaranteed on runner images).
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "spid3r-${{ matrix.target }}.tar.gz" > "spid3r-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "spid3r-${{ matrix.target }}.tar.gz" > "spid3r-${{ matrix.target }}.tar.gz.sha256"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            spid3r-${{ matrix.target }}.tar.gz
            spid3r-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # Windows NSIS installer: build.rs packages Spid3r-Setup-<version>.exe on any
  # Windows *release* build (see `windows_installer` in build.rs — nested release
  # build + makensis, APPVERSION from Cargo.toml). This job installs LLVM 18
  # first so the NATIVE AOT backend ships too — matching the 1.0.0 installer
  # (LLVM-C.dll + LLVM-C.lib + spid3r_lang.lib in the payload, ~30 MB); without
  # it `spid3r build` cannot produce standalone executables. SPID3R_NO_INSTALLER
  # is overridden to "0" so build.rs actually packages.
  windows-installer:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-installer

      # NSIS (packaging) + LLVM 18.1.9 (the exact major.minor the `native`
      # backend's inkwell binding targets — "llvm18-1"). Choco installs into
      # C:\Program Files\LLVM, which build.rs probes by default; pin the
      # version or choco serves the latest major and the binding fails.
      - name: Install NSIS and LLVM 18.1.9
        timeout-minutes: 15
        run: |
          choco install nsis -y --no-progress
          choco install llvm --version=18.1.9 -y --no-progress --allow-downgrade
          Test-Path "C:\Program Files\LLVM\bin\LLVM-C.dll"
          Test-Path "C:\Program Files\LLVM\lib\LLVM-C.lib"

      - name: Build release with NSIS installer (core + gui + native)
        timeout-minutes: 55
        env:
          # Overrides the workflow-wide skip for this job only ("0" = falsy in
          # build.rs's env parsing).
          SPID3R_NO_INSTALLER: "0"
        run: cargo build --release --locked --no-default-features --features gui,native

      - name: Verify the installer and its native payload
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Filter "Spid3r-Setup-*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "::error::no Spid3r-Setup-*.exe was produced (build.rs skips silently on a missing NSIS — check earlier steps)"; exit 1 }
          # A native-capable installer must carry the LLVM payload: it cannot
          # be smaller than ~15 MB compressed. 2-3 MB means build.rs skipped
          # the native files (missing LLVM) and the toolchain lost `spid3r build`.
          if ($exe.Length -lt 15MB) { Write-Error "::error::installer is $($exe.Length) bytes — the native/LLVM payload is missing"; exit 1 }
          Write-Host "Installer: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-installer
          path: Spid3r-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release assets
    needs: [build, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Verify all four tarballs and the Windows installer are present
        run: |
          cd dist
          for t in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin; do
            test -s "spid3r-${t}.tar.gz" || { echo "MISSING: spid3r-${t}.tar.gz"; exit 1; }
          done
          ls Spid3r-Setup-*.exe || { echo "MISSING: Spid3r-Setup-*.exe"; exit 1; }
          ls -l

      - name: Generate combined checksum file
        run: |
          cd dist
          cat *.sha256 > sha256sums.txt
          # Self-check: every listed checksum must verify.
          sha256sum -c sha256sums.txt

      # Attaches the tarballs to the release of the pushed tag (creates the
      # release object if the tag exists without one). `clobber: false` is
      # the default and pinned explicitly: an accidental re-run against an
      # already-published release must fail, not overwrite assets.
      - name: Attach assets to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/spid3r-*.tar.gz
            dist/Spid3r-Setup-*.exe
            dist/sha256sums.txt
          clobber: false
          fail_on_unmatched_files: true
          body: |
            Prebuilt spid3r binaries (core toolchain: VM + interpreter, stdlib compiled in) and the Windows NSIS installer (core + gui + **native AOT backend** with bundled LLVM — `spid3r build` works out of the box).

            Install on Linux/macOS:
            ```
            curl -fsSL https://raw.githubusercontent.com/needyamin/spid3r/main/install.sh | sh
            ```

            Windows: run `Spid3r-Setup-<version>.exe`. Or download `spid3r-<target>.tar.gz` for your platform, untar, and put `spid3r` on your PATH. SHA-256 sums: `sha256sums.txt`.

            Linux/macOS tarballs are core-only (no LLVM/WebKit system dependencies). The GUI (`spid3r gui`) and the native AOT backend require building from source — see `docs/BUILDING.md`.
