name: Fuzz

# Audit A-18: `fuzz/` shipped three cargo-fuzz targets that nothing ever ran.
# This job runs them on nightly (libfuzzer needs the nightly compiler) so a
# parser/lexer/bytecode regression is found by the fuzzer, not by a user.

on:
  schedule:
    # Weekly, Monday 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        required: false
        default: "120"
  pull_request:
    paths:
      - "src/lexer/**"
      - "src/parser/**"
      - "src/semantic/**"
      - "src/vm/bytecode.rs"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_lexer, fuzz_parser, fuzz_bytecode]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Run ${{ matrix.target }}
        working-directory: fuzz
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '120' }}
        run: |
          cargo fuzz run "${{ matrix.target }}" -- \
            -max_total_time="${SECONDS_PER_TARGET}" \
            -rss_limit_mb=2048 \
            -print_final_stats=1

      # A crash leaves the reproducer under fuzz/artifacts/<target>/.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30
