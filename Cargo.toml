[package]
name = "spid3r"
version = "1.1.1"
edition = "2021"
# MSRV: the toolchain is pinned in rust-toolchain.toml and ci.yml.
rust-version = "1.98"
description = "Spid3r - A professional programming language. The compiler and VM are written in Rust."
license = "GPL-3.0-or-later"
default-run = "spid3r"
autotests = false

[lib]
name = "spid3r_lang"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "spid3r"
path = "src/main.rs"

[[bin]]
name = "sp"
path = "src/sp_main.rs"

[[bin]]
name = "yamc"
path = "src/yamc_main.rs"

[[bin]]
name = "yamcvm"
path = "src/yamcvm_main.rs"

[[bin]]
name = "spvm"
path = "src/spvm_main.rs"

[[bin]]
name = "spkg"
path = "src/spkg_main.rs"

# The desktop control panel. Requires the gui stack (wry/tao), so core-only
# builds — the Linux/macOS release tarballs, CI --no-default-features — skip
# it entirely; those platforms manage the runtime with `spid3r control`.
[[bin]]
name = "spid3r-control"
path = "src/control_main.rs"
required-features = ["gui"]



[features]
# The core language toolchain is zero-dependency; the backends add their own
# dependencies and are both on by default (build the core alone with
# --no-default-features, or pick one with --no-default-features --features gui):
#   gui    - embedded webview GUI via wry + tao.
#   native - LLVM AOT backend (machine code) via inkwell, like rustc; needs
#            LLVM 23.1+ installed to build (see docs/BUILDING.md).
default = ["gui", "native", "tls"]
native = ["dep:inkwell"]
gui = ["dep:wry", "dep:tao"]
# TLS for `http_fetch` (https://) via native-tls: schannel on Windows,
# OpenSSL on Linux, Security.framework on macOS. Opt-in so the core
# toolchain stays zero-dependency; build with --features tls.
tls = ["dep:native-tls"]

[dependencies]
# inkwell is a BUILD-TIME dependency of the native backend only. It requires
# LLVM 23.1+ installed on the machine (see docs/BUILDING.md). The
# `no-llvm-linking` feature is required because llvm-sys neither supports
# dynamic linking on Windows nor ships a built-in llvm-config for the stock
# installer; build.rs links the LLVM C API library itself.
#
# The AOT backend compiles for the host only (x86_64 / aarch64), so inkwell is
# restricted to those two targets with `default-features = false` — inkwell's
# default feature is target-all, and LLVM 23's LLVM-C import library no longer
# exports the C API initializers for the exotic targets (Mips, Lanai, ... were
# dropped from the C API surface: 44 LLVMInitialize* symbols, down from 116 in
# LLVM 18), so target-all cannot link.
inkwell = { version = "0.11.0", default-features = false, features = [
    "llvm23-1-no-llvm-linking",
    "target-x86",
    "target-aarch64",
], optional = true }
# TLS backend for the `tls` feature (https:// in http_fetch). Uses the OS
# certificate store; no pinned CA bundle to rotate.
native-tls = { version = "0.2", optional = true }
# GUI backend (Phase 2): embedded webview via wry on tao.
wry = { version = "0.53", features = ["devtools"], optional = true }
tao = { version = "0.34", optional = true }

[profile.release]
opt-level = 3
# N1.1 (optimize_plan.html AF8): cross-crate LTO over the interpreter dispatch
# loop, the runtime peeks and the stdlib fast paths, and a single codegen unit
# so the hot match arms can inline across the crate boundary. Build-config
# only: no code semantics, no new dependency, no unsafe. Build time increases.
lto = "thin"
codegen-units = 1
# Panic on integer overflow in release builds instead of silently wrapping
# (audit S-5). The runtime computes indices, sizes and hashes from
# script-controlled i64 values; the per-call-site checked/saturating guards
# cover the known hot spots, and this makes any future unguarded arithmetic
# loud rather than a silent wrap. Matches debug semantics exactly.
overflow-checks = true

# Track 6 WASM-3: Fat LTO + single codegen unit for canonical browser WASM
# builds (`cargo build --target wasm32-unknown-unknown --profile wasm-release --lib --no-default-features`).
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
# Incremental compilation corrupts its cache on OneDrive-synced trees
# (the documented "error deleting lock file (os error 5)" quirk can escalate
# into a rustc ICE in the metadata encoder). Reliability over rebuild speed.
incremental = false

